<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Allan Cepeda</title>
<meta name="description" content="Apps hechas por Allan Cepeda.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root{--bg:#eef3ec;--surface:#fff;--ink:#16231b;--muted:#5a6a60;--leaf:#2c7a4b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1511;--surface:#17211b;--ink:#e5eee8;--muted:#97a99d;--leaf:#5cc184;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:1.4rem}
p{margin:0;color:var(--muted)}
a.app{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit}
a.app img{width:56px;height:56px;border-radius:14px}
a.app b{display:block;font-size:1.05rem}
a.app span{color:var(--muted);font-size:.9rem}
a.app .go{margin-left:auto;color:var(--leaf);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Allan Cepeda</h1>
  <p>Mis aplicaciones</p>
  <a class="app" href="/mi-cota-fitness/">
    <img src="icon-192.png" alt="">
    <div><b>Mi Cota Fitness</b><span>Calorías, ejercicio, ayuno y más</span></div>
    <span class="go">Abrir ›</span>
  </a>
  <p style="font-size:.85rem"><a href="/mi-cota-fitness/descargar.html" style="color:var(--leaf)">Descargar para Android</a></p>
</main>
</body>
</html>
