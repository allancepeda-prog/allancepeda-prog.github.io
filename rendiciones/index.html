<style>
/* Layout: app de bolsillo — cabecera verde, contenido en una columna, barra de pestañas fija abajo y botón grande para fotografiar boletas */
:root{
  --bg:#f5f8f3; --surface:#ffffff; --surface-2:#eaf1e6; --line:#d6e2d0;
  --fg:#1d2a1f; --muted:#5d6e60; --brand:#2f8f3a; --brand-deep:#1f6b2a; --brand-ink:#ffffff;
  --navy:#0b2d6b; --red:#d8432f; --amber:#e9a21c; --blue:#2a6fdb;
  --ok:#2f8f3a; --warn:#b7791f; --bad:#c0392b; --badbg:#fdecea; --warnbg:#fff4dc; --okbg:#e6f4e7;
  --display:"Fredoka","Nunito Sans",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111812; --surface:#18221a; --surface-2:#1f2c22; --line:#2c3b2f;
  --fg:#e7efe6; --muted:#9db09f; --brand:#4cb85a; --brand-deep:#3a9d48; --brand-ink:#0d150e;
  --navy:#8fb0f0; --red:#f07a66; --amber:#f2bd55; --blue:#7aa8f5;
  --ok:#5cc66a; --warn:#e8b04a; --bad:#f08a7e; --badbg:#3a1f1c; --warnbg:#3a2f17; --okbg:#1c3320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111812; --surface:#18221a; --surface-2:#1f2c22; --line:#2c3b2f;
  --fg:#e7efe6; --muted:#9db09f; --brand:#4cb85a; --brand-deep:#3a9d48; --brand-ink:#0d150e;
  --navy:#8fb0f0; --red:#f07a66; --amber:#f2bd55; --blue:#7aa8f5;
  --ok:#5cc66a; --warn:#e8b04a; --bad:#f08a7e; --badbg:#3a1f1c; --warnbg:#3a2f17; --okbg:#1c3320; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-deep)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand-deep);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
header.top img{width:42px;height:42px;border-radius:10px;background:#fff;padding:3px}
header.top h1{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;line-height:1.1;text-wrap:balance}
header.top small{display:block;opacity:.85;font-size:.78rem}
header.top .grow{flex:1;min-width:0}
select,input,textarea,button{font:inherit;color:inherit}
.yearSel{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 8px;color:#fff}
.yearSel option{color:#1d2a1f}
main{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.status{font-size:.85rem;color:var(--muted);padding-block:8px}
.status.err{color:var(--bad)}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:18px 0 8px}
h3{font-family:var(--display);font-weight:500;font-size:1rem;margin:14px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi .v.neg{color:var(--bad)} .kpi .v.pos{color:var(--ok)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--brand)}
.row:focus-visible,.btn:focus-visible,.tab:focus-visible,.act:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.thumb{width:54px;height:54px;border-radius:9px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;font-size:.65rem;color:var(--muted);text-align:center;overflow:hidden}
.row .t{min-width:0}
.row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .chip{display:inline-block!important}
.row .t span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.amt.in{color:var(--ok)}
.chip{display:inline-block;white-space:nowrap;font-size:.7rem;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.chip.abierta{background:var(--warnbg);color:var(--warn)} .chip.enviada{background:#e3ecfb;color:var(--navy)} .chip.aprobada{background:var(--okbg);color:var(--ok)}
:root[data-theme="dark"] .chip.enviada{background:#1d2a44}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.enviada{background:#1d2a44}}
.chip.nofoto{background:var(--badbg);color:var(--bad)}
.act{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.act:hover{border-color:var(--brand)}
.act .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.act .h b{font-family:var(--display);font-weight:500;font-size:1.05rem;min-width:0}
.act .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.8rem;color:var(--muted)}
.act .nums b{display:block;color:var(--fg);font-variant-numeric:tabular-nums;font-size:.95rem}
.neg{color:var(--bad)!important}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--surface-2);color:var(--fg)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.navy{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.navy{color:#0b1530}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.navy{color:#0b1530}}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;border:0;border-radius:99px;background:var(--red);color:#fff;font-weight:700;font-size:1rem;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab svg{width:22px;height:22px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:10px 4px 12px;font-weight:700;font-size:.8rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel h2{margin-top:0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.photo{border:2px dashed var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:12px;background:var(--surface)}
.photo img{width:88px;height:110px;object-fit:cover;border-radius:8px}
.photo .ph{width:88px;height:110px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.photo .ph svg{width:34px;height:34px}
.photo label.btn{display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.wrap td:first-child,table.wrap th:first-child{white-space:normal}
.sub{display:block;font-size:.75rem;color:var(--muted);white-space:normal;margin-top:2px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.over{background:var(--bad)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 0}
.months div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;min-width:0}
.months i{display:block;width:70%;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.months span{font-size:.62rem;color:var(--muted);padding-bottom:4px}
.note{font-size:.82rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:600;max-width:90%}
.back{background:none;border:0;color:var(--brand);font-weight:700;padding:10px 0;cursor:pointer}
.confirm{background:var(--badbg);border-radius:12px;padding:10px;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

/* ---------- derivados ---------- */
function yearMovs(y=S.year){return S.movs.filter(m=>m.anio===y)}
function actMovs(id){return S.movs.filter(m=>m.actividadId===id)}
function actTotals(id){const ms=actMovs(id);let g=0,i=0,aporte=0,reemb=0,sinFoto=0;for(const m of ms){if(m.tipo==="ingreso"){i+=m.monto;if(m.concepto==="Aporte AIBOR")aporte+=m.monto;else if(m.concepto==="Reembolso AIBOR")reemb+=m.monto}else{g+=m.monto;if(!m.fotoId&&!m.respaldoExterno)sinFoto++}}
  const aibor=aporte+reemb,propios=i-aibor,saldo=i-g,pend=Math.max(0,-saldo),devolver=Math.min(Math.max(0,saldo),aibor);
  return{g,i,aporte,reemb,aibor,propios,saldo,pend,devolver,usoAibor:aibor+pend-devolver,sinFoto,n:ms.length}}
function budget(y=S.year){return Number(S.cfg["presupuesto_"+y]||0)}
function itemUsado(y=S.year){return S.acts.filter(a=>a.anio===y).reduce((u,a)=>u+actTotals(a.id).usoAibor,0)}
function estadoTxt(e){return{abierta:"En curso",enviada:"Rendición enviada",aprobada:"Aprobada"}[e]||"En curso"}

function controlView(){
  const ms=yearMovs();const g=ms.filter(m=>m.tipo!=="ingreso"),i=ms.filter(m=>m.tipo==="ingreso");const G=g.reduce((s,m)=>s+m.monto,0),I=i.reduce((s,m)=>s+m.monto,0);const B=budget(),U=itemUsado();
  const byM=Array(12).fill(0);g.forEach(m=>{const k=Number(String(m.fecha).slice(5,7))-1;if(k>=0)byM[k]+=m.monto});const mx=Math.max(1,...byM);

async function readReceipt(data){

    if(r.fecha&&set("#fFecha",r.fecha,true))filled.push("fecha");if(r.monto&&set("#fMonto",String(r.monto)))filled.push("monto");

function numWords(n){
  n=Math.round(n);if(n===0)return"cero";
  const U=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
  const D=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const C=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
  const h=x=>{if(x===0)return"";if(x===100)return"cien";let s="";const c=Math.floor(x/100),r=x%100;if(c)s=C[c];if(r){s+=(s?" ":"")+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?" y "+U[r%10]:""))}return s};
  const parts=[];const mill=Math.floor(n/1e6),miles=Math.floor(n%1e6/1000),rest=n%1000;
  if(mill)parts.push(mill===1?"un millón":h(mill).replace(/uno$/,"un")+" millones");
  if(miles)parts.push(miles===1?"mil":h(miles).replace(/veintiuno$/,"veintiún").replace(/uno$/,"un")+" mil");
  if(rest)parts.push(h(rest));
  return parts.join(" ")
}
function wrapText(ctx,text,x,y,maxW,lh){const words=String(text).split(/\s+/);let line="";for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w}else line=t}if(line){ctx.fillText(line,x,y);y+=lh}return y}

  $("#cSave").disabled=true;msg.className="status";msg.textContent="Creando comprobante…";
  try{const actId=$("#cAct").value;const act=S.acts.find(z=>z.id===actId);const anio=Number(fecha.slice(0,4));const num=nextCE(anio);
    const d={num,fecha,monto,a,rut:$("#cRut").value.trim(),cal:$("#cCal").value.trim(),glosa,forma:$("#cForma").value,tr:$("#cForma").value==="Transferencia"?$("#cTr").value.trim():"",cat:$("#cCat").value,actividad:act?act.nombre:"",enc:(S.cfg.directivo||"").split("/").map(z=>z.trim()).filter(Boolean),firma:CE.want&&CE.sig?$("#sig").toDataURL("image/png"):null};
    const blob=await renderCE(d);const data=await b64(blob);msg.textContent="Guardando en Drive…";
    apply(await call("saveMov",S.pin,{id:"",tipo:"gasto",fecha,monto,actividadId:actId||"",concepto:d.cat,docTipo:"Comprobante de egreso",nDoc:num,proveedor:a,detalle:glosa,responsable:$("#cResp").value.trim(),pago:$("#cPago").value,reembolsado:false,registradoPor:S.me,respaldoExterno:""},{b64:data}));
    msg.textContent="";$("#cSave").hidden=true;$("#cCancel").textContent="Cerrar";
    $("#cDone").innerHTML=`<div class="kpi"><b>Comprobante N° ${num} creado y guardado en Drive.</b><p class="note">Quedó como gasto${act?" de "+esc(act.nombre):""} y entra en la rendición.</p><img src="data:image/jpeg;base64,${data}" alt="Comprobante" style="width:100%;border:1px solid var(--line);border-radius:8px"></div>`;
  }catch(e){msg.className="status err";msg.textContent="No se creó: "+(e.message||e);$("#cSave").disabled=false}
}

/* ---------- inicio ---------- */
(async()=>{
  const p=store.get("rk_pin");S.me=store.get("rk_me");
  if(!p||!S.me){loginView();return}
  $("#view").innerHTML=`<p class="status">Cargando…</p>`;
  try{apply(await call("getData",p));S.pin=p;render()}catch(e){loginView(/Clave/.test(e.message)?"La clave cambió. Escríbela de nuevo.":"No se pudo conectar: "+e.message)}
})();

</script>
